name: net_route_scout
description: "Net Route Scout - Visual Multi-Hop Network Topology & Traceroute Mapper"
publish_to: 'none'

version: 0.7.3+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  network_suite_shared:
    git:
      url: https://github.com/Tom-McGuire/network-suite-shared.git
      ref: main

  provider: ^6.1.5+1
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.6.0+eol
  file_picker: ^13.1.0
  path: ^1.9.1
  dart_snmp: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/app_icon.jpg
